





settings:


  plugin-prefix: "&#00b4ff◈ &#ffffff ChatOS &#8b8b8b│"


  log-to-console: true


  log-to-file: true


  staff-join-notify: true


  word-filter:
    enabled: false
    words:
      - "badword1"
      - "badword2"


  message-sound:
    enabled: true
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 0.8
    pitch: 1.4


  helpop-sound:
    enabled: true
    sound: "BLOCK_NOTE_BLOCK_PLING"
    volume: 1.0
    pitch: 2.0


  broadcast-sound:
    enabled: true
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 0.6
    pitch: 1.0


  auto-toggle-off-seconds: 0


  max-history-lines: 50


  proxy:
    enabled: false

    mode: "PLUGIN_MESSAGING"


  staff-mode:

    vanish: true

    god-mode: true

    inventory-save: true
















channels:
  staff:
    name: "Staff Chat"
    permission: "chatos.staffchat"
    format: "&#00b4ff⚡ &#8b8b8b{rank}&#ffffff{displayname} &#8b8b8b» &#ffffff{message}"
    prefix: "&#00b4ff[SC]"
    spy-format: "&#8b8b8b[SPY &#00b4ff{server}&#8b8b8b] {rank}&#ffffff{displayname} &#8b8b8b» &#ffffff{message}"
    color: "&#00b4ff"
    proxy-broadcast: true
    logged: true
    muted: false
    sound-override: ""

    aliases:
      - "sc"
      - "staff"

  admin:
    name: "Admin Chat"
    permission: "chatos.adminchat"
    format: "&#ff4444⚑ &#8b8b8b{rank}&#ffffff{displayname} &#8b8b8b» &#ffffff{message}"
    prefix: "&#ff4444[AC]"
    spy-format: "&#8b8b8b[SPY &#ff4444{server}&#8b8b8b] {rank}&#ffffff{displayname} &#8b8b8b» &#ffffff{message}"
    color: "&#ff4444"
    proxy-broadcast: true
    logged: true
    muted: false
    sound-override: ""
    aliases:
      - "ac"
      - "admin"

  dev:
    name: "Dev Chat"
    permission: "chatos.devmode"
    format: "&#44ff88⌨ &#8b8b8b{rank}&#ffffff{displayname} &#8b8b8b» &#ffffff{message}"
    prefix: "&#44ff88[DC]"
    spy-format: "&#8b8b8b[SPY &#44ff88{server}&#8b8b8b] {rank}&#ffffff{displayname} &#8b8b8b» &#ffffff{message}"
    color: "&#44ff88"
    proxy-broadcast: false
    logged: true
    muted: false
    sound-override: ""
    aliases:
      - "dc"
      - "dev"







